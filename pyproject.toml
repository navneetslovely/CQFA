[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqfa"
version = "1.0.0"
description = "Coherent Quantum Frame Averaging: a representation dial for trainable, hard-to-simulate quantum machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=2.0",
    "qiskit-aer>=0.16",
    "qiskit-machine-learning>=0.9",
    "qiskit-ibm-runtime>=0.40",
]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
